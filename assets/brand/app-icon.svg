<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 職缺體檢 App 圖示「公文包＋心跳線」（2026-10-27 改版：使用者從三個方案選定，ChatGPT 草圖後重畫成向量；
       扣環用品牌黃色、心跳線加粗，縮到 40px 仍看得到）。
       npm run assets:brand 由這個檔產生全部圖示；啟動畫面與 Android 前景只用 mark（不含背景）。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF8E6E"/>
      <stop offset="1" stop-color="#FF6B4A"/>
    </linearGradient>
  </defs>
  <rect id="background" width="1024" height="1024" fill="url(#bg)"/>
  <g id="mark">
    <path d="M372 296V250a62 62 0 0 1 62-62h156a62 62 0 0 1 62 62v46" fill="none" stroke="#2B2118" stroke-width="46"/>
    <rect x="196" y="420" width="632" height="408" rx="76" fill="#FFFFFF" stroke="#2B2118" stroke-width="46"/>
    <rect x="156" y="296" width="712" height="190" rx="76" fill="#FFFFFF" stroke="#2B2118" stroke-width="46"/>
    <rect x="282" y="420" width="104" height="124" rx="30" fill="#FFD66B" stroke="#2B2118" stroke-width="40"/>
    <rect x="638" y="420" width="104" height="124" rx="30" fill="#FFD66B" stroke="#2B2118" stroke-width="40"/>
    <polyline points="244,676 410,676 462,578 530,766 592,630 634,676 780,676" fill="none" stroke="#FF6B4A" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
